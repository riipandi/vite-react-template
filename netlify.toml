[build.environment]
NODE_VERSION = "24.20.0"
NPM_VERSION = "11.19.0"
PNPM_VERSION = "12.3.4"
TZ = "Asia/Jakarta"

# Since Storybook 10, the build emits relative asset URLs, so subpath
# deployments work out of the box — no base/config override needed.
[build]
  command = "pnpm run build"
  publish = "dist"

# SPA fallback (existing assets and the /api/* function are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
