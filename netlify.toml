[build.environment]
NODE_VERSION = "24.21.0"
NPM_VERSION = "11.19.0"
PNPM_VERSION = "12.3.4"
TZ = "Asia/Jakarta"

# Since Storybook 10, the build emits relative asset URLs, so subpath
# deployments work out of the box — no base/config override needed.
[build]
  command = "pnpm run build"
  publish = ".output/build"

# SPA fallback (existing assets and the /api/* function are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Default for every served path — documents and SPA deep links always
# revalidate (Netlify purges its CDN on each deploy, so this only costs a
# cheap conditional request and guarantees fresh asset references). Later
# matching rules below override this for content-addressed assets.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
