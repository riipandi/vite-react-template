# Netlify deployment for the demo (DummyJSON backend).
#
# Cookie-based auth requires a same-origin API. netlify/functions/api.ts is
# routed to /api/* via its own config.path (no redirects involved — a
# public/_redirects splat would take precedence over these rules anyway).
# Caching: hashed build assets are immutable; HTML stays revalidated for SPA
# fallback.

[build]
  command = "pnpm build"
  publish = "dist"

# SPA fallback (existing assets and the /api/* function are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
