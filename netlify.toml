# Netlify deployment for the demo (DummyJSON backend).
#
# Cookie-based auth requires a same-origin API: the force-200 rewrites below
# make Netlify act as a same-origin reverse proxy, so the HttpOnly session
# cookies land on the site's own domain. Session probe and logout need logic —
# they are served by the Netlify Functions in ./netlify/functions.

[build]
  command = "pnpm build"
  publish = "dist"

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/logout"
  status = 200
  force = true

# Same-origin proxy to the demo backend.
[[redirects]]
  from = "/api/*"
  to = "https://dummyjson.com/:splat"
  status = 200
  force = true

# SPA fallback (existing assets are served before this catch-all).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
